[Backtrack]
; Feature switch + sampling period (ms) between position samples
Enabled  = True
DelayMs  = 200

[Offsets]
EntityList      = 0x3A16E28 ; static pointer to the live entity table; use it to enumerate all live entities / pawns
CamEnc           = 0x39AEF28 ; encrypted camera pointer; feed through decrypt_camera to get view/proj matrices (ESP, world-to-screen)

ClientGame       = 0x3B796A8 ; client game manager; hop into GameAdmin to read the local player UID
GlobalAdmin      = 0x3B7F410 ; GlobalAdmin pointer; feed through decrypt_globaladmin to read the current map id

GKeyPtr          = 0x3B79598 ; component key table pointer; read CompKeyOff / SmGKeyOff from it to fetch decrypt keys
ByteKey          = 0x38480F3 ; single-byte XOR key (bkey) applied during decrypt_component
SmXorByte        = 0x38489D0 ; single-byte XOR key (smk) applied during decrypt_servermanager

CompKeyOff       = 0x198 ; offset into the GKeyPtr table that yields the component decrypt key
SmGKeyOff        = 0x1C4 ; offset into the GKeyPtr table that yields the servermanager decrypt key

FovRva            = 0x4139EF8 ; FOV CVar; read/write to change the player's field of view

VersionString     = 0x419FC38 ; game version string; confirm you're on the expected build
LatOverrideRva   = 0x3872E90 ; latency override; read/write to spoof or suppress ping

EntHandleFreeHead = 0x3A16E2C ; head of the free-handle list; scan it to find empty slots
EntHandleFreeTail = 0x3A16E30 ; tail of the free-handle list
EntHandleCapacity = 0x3A16E14 ; total handle slots in the entity table (capacity)
EntHandleLive     = 0x3A16E18 ; count of currently live handles (active entities)
EntCompBase      = 0x80 ; per-entity component pointer array; index by (component_id * 8) to fetch a component
EntBitmap        = 0x110 ; per-entity component bitmap; bit (id & 63) says whether that component is present
EntIndex         = 0x130 ; entity's index in the entity table (look up the entity handle)
EntUid           = 0x138 ; entity's network UID; match against the local uid to identify the local pawn

VisibilityComponent = 0x34 ; component id for the visibility component; resolve via decrypt_component
VisibilityField     = 0x98 ; field inside the visibility component; (value & 0x100000000) != 0 means the entity is visible (vischeck)

HealthMax   = 0xDC ; max health value of the health component
HealthCur   = 0xE4 ; current health value of the health component
HealthState = 0xE8 ; health state flag (immortal / untargetable states)

ArmorMax   = 0x260 ; max armor value
Armor      = 0x264 ; current armor value

BarrierMax = 0x3E0 ; max barrier (shield) value
Barrier    = 0x3E4 ; current barrier value

IsImmortal        = 0x4A9 ; flag: whether the health component is immortal (Reaper wraith, Moira fade, etc.)
IsBarrierProjected = 0x4A8 ; flag: projected barrier (Orisa barrier)

ObjectPosition     = 0xE0 ; object's world position (x,y,z) — draw a box / line around the entity
Location           = 0x200 ; pawn's location (world position) — consumed by backtrack sampling and aim assist
ViewDir            = 0x1260 ; view direction vector — compute crosshair direction / aim angle

SilentAngle        = 0x1214 ; silent aim angle — write the desired aim angle to move the crosshair without touching the mouse
Input              = 0x121C ; input component pointer — the local player's input entity

VerticalRecoil     = 0x16C4 ; vertical recoil compensation; read/write to implement recoil control
HorizontalRecoil   = 0x16C8 ; horizontal recoil compensation; read/write to implement recoil control

HeroGuid           = 0xD0 ; hero guid / id — identifies which hero the pawn is
BoneData           = 0x8B0 ; model skeleton / bone data pointer — hitbox / bone-based aiming (aim-bone selection)

DecrCmp_Add1     = 0x4D79452D486F9431 ; C1: addend added right after ror56 in the decrypt_component chain
DecrCmp_Xor1     = 0xEC99E783D64E4C83 ; C2: first XOR key applied in decrypt_component
DecrCmp_Sub1     = 0x327AECC3F519246F ; C3: subtrahend subtracted in decrypt_component
DecrCmp_Xor2     = 0x8B084BD971B946CC ; C4: second XOR key applied in decrypt_component
DecrCmp_Sub2     = 0x32C1C6A5A278CA6F ; C5: subtrahend subtracted at the end of decrypt_component
DecrCam_Sub1     = 0x4DB7A52E3078E2D4 ; C1: subtrahend of decrypt_camera (dec = ((enc - C1) ^ C2) - C3)
DecrCam_Xor1     = 0x89D3E0B8C0994ABF ; C2: XOR key of decrypt_camera
DecrCam_Sub2     = 0x7DF4771CBF549150 ; C3: subtrahend of decrypt_camera

DecrGa_Sub1       = 0x4EDFE89771F84ECB ; C1: subtrahend applied right after ror23 in decrypt_gameadmin
DecrGa_Xor1       = 0x8CDA125D457A5953 ; C2: XOR key applied after ror53 in decrypt_gameadmin
DecrGa_Add1       = 0x3F05631ECBC52CF9 ; C3: addend at the end of decrypt_gameadmin -> local_uid lives at +0x2F0

DecrGAdmin_Add1   = 0x3FA981C8E7192FA6 ; C1: addend applied at the start of decrypt_globaladmin
DecrGAdmin_Xor1   = 0x8784B4333A580288 ; C2: XOR key applied after ror31 in decrypt_globaladmin
DecrGAdmin_Add2   = 0x37A9E6A2EEDD5214 ; C3: addend after ror41 -> map_record at +0x180, map_id at +0x18 & 0xFFFFFF

DecrSm_Sub1       = 0x7BE56F12AD24283 ; C1: subtrahend applied after ^key / ^smk in decrypt_servermanager
DecrSm_Xor2       = 0xAD14668946BE46D9 ; C2: second XOR key applied after ror51 in decrypt_servermanager
DecrSm_Add1       = 0xA13CB7C37FAB502 ; C3: addend at the end -> interp_context at +0x50

Outline_Xor1      = 0x3CB66562A9D6A60 ; C1: first XOR key in outline_encrypt
Outline_Sub1      = 0x6494B1884CAF70EE ; C2: subtrahend in outline_encrypt
Outline_Xor2      = 0x2BB16A93AA826DCC ; C3: second XOR key in outline_encrypt
Outline_Add1      = 0x4C5F671FD43F24D6 ; C4: addend applied after ror47 in outline_encrypt
Outline_Add2      = 0x19AF6DE55CD15AED ; C5: final addend (write the result to outline_base + 0x58)


; --- backtrack candidate offsets, thread 771966 #5 (palacestreet) ---
; Component id for the Lerp component (lag-compensation interpolation); resolve via decrypt_component
LerpComponent  = 0x1F ; (771966 #5) Lerp component id - used by the game's lag compensation / backtrack record selection
; Component id for the Connection component; the local player's connection record ("Conn")
ConnectionComp  = 0x42 ; (771966 #5) Connection component id -> Conn (note: component ids are build-pinned; 0x42 meant PlayerPawn on 23432)
; Offset into the Connection component that points at the game's own lag-comp snapshot ring buffer
ConnRingBufOff  = 0x1C6 ; (771966 #5) auto RingBuffer = Conn[0x1C6] - the game's snapshot history; rewind through it for backtrack
